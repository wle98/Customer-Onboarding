<div>

    <section class="getCustomerDocuments">
        <h2>Customer's Documents</h2>
    </section>

    <section class="uploadDocuments">
        <h2>Upload Documents</h2>

        <input type="text" name="customerID" id="customerID">

        <label for="document">Document</label>

        <button onclick="documentUpload(customerID)">Upload</button>

        <script src="../Document/documentUpload.js"></script>

    <section class="getDocuments">
        <h2>Get Documents</h2>
    </section>

    <section class="deleteDocuments">
        <h2>Delete Documents</h2>
    </section>

</div>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div>

    <p id="errorMessage"></p>

    <section class="getCustomerDocuments">
        <h2>Customer's Documents</h2>
        <label for="customerIDReturn">Customer ID</label>
        <input type="text" name="customerIDReturn" id="customerIDReturn">
        <button onclick="documentbyCustomer(customerIDReturn)">View</button>
        <p id="customerFileReturn"></p>

        <table id="table">
            <tr>
                <th>File Name</th>
                <th>Document Type</th>
                <th>File Size</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </table>
        <button onclick="prevPage('table','pageSpan')" class="prev" disabled>Prev</button>
        <button onclick="nextPage('table','pageSpan')" class="next">Next</button>
        <span id="pageSpan"></span>
    </section>

    <section class="uploadDocuments">
        <h2>Upload Documents</h2>
        <form id="uploadForm">
            <label for="customerID">Customer ID</label>
            <input type="text" name="customerID" id="customerID">

            <label for="document">Document</label>
            <input type="file" name="document" id="document">
            <button type='button' onclick="documentUpload(customerID,'document','IDcount')">Upload</button>
        </form>

        <section id="uploadedDocuments">
            <h4>Uploaded Documents</h4>
            <section id="documentList"></section>
        </section>
    </section>

    <section class="getDocuments">
        <h2>Get Documents</h2>
        <label for="returnID">Document ID</label>
        <input type="text" name="returnID" id="returnID">
        <button onclick="documentbyID(returnID)">View</button>
        <p id="returnResult"></p>
    </section>

    <section class="deleteDocuments">
        <h2>Delete Documents</h2>
        <label for="deleteID">Document ID</label>
        <input type="text" name="deleteID" id="deleteID">
        <button onclick="documentDelete(deleteID.value)">Delete</button>
    </section>

</div>

</body>

<script src="../Document/documentbyCustomer.js"></script>
<script src="../Document/documentUpload.js"></script>
<script src="../Document/documentbyID.js"></script>
<script src="../Document/documentDelete.js"></script>
<script src="../otherJS/tablePages.js"></script>

</html>

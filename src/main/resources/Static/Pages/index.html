<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../CSS/mainCSS.css">
    <title>Step 1</title>
</head>
<body>

<div class="dataInput">
    <nav>
        <section><h2>Customer Onboarding</h2>
            <p>Step 1 of 3 - Customer Information</p>
        </section>
    </nav>

    <h3>Customer Information</h3>
    <p>Please provide the basic details of the customer</p>
    <hr>

    <script src="../Customer/customerCreate.js"></script>
    <script src="../Customer/customerDelete.js"></script>
    <form>
        <section class="customerID">
            <label for="customerName">Customer Name</label>
            <input type="text" name="customerName" id="customerName">
        </section>

        <section class="inputTwice">
            <section class="email1">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
            </section>

            <section class="phone1">
                <label for="phone">Phone Number</label>
                <input type="tel" name="phone" id="phone">
            </section>
        </section>

        <section class="inputTwice">
            <section class="address">
                <label for="address">Address</label>
                <input type="text" name="address" id="address">
            </section>

            <section class="registration">
                <label for="businessType">Business Type</label>
                <input type="text" name="businessType" id="businessType">
            </section>
        </section>

        <input type="hidden" id="response">
    </form>
        <hr>
        <section class="options">
            <button onclick="customerCreate(customerName,email,phone,address,businessType)">Save</button>
            <button onclick="customerDelete(response)">Cancel</button>
            <button onclick="window.location.href=`Page2.html`">Next</button>
        </section>
</div>

</body>
</html>
